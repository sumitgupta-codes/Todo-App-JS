<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-100">

    <div class="bg-white max-w-md mx-auto rounded-lg mt-5 ">
        <div class="bg-indigo-500 text-white p-5 rounded-xl">
            <h1>Todo App</h1>
        </div>

        <div class="p-5">
            <form id="todo-form" action="" class="flex gap-5">
                <input id="todo-input" class="border flex-1 border-black p-2 rounded-lg" type="text"
                    placeholder="Enter task description....">
                <div class="flex flex-col items-center relative">
                    <button id="form-btn"
                        class="px-4 py-2 text-xl text-white bg-indigo-400 rounded-xl hover:bg-indigo-500 transition duration-200">Add</button>
                    <p id="cancel-btn" href="#"
                        class="hidden absolute top-12 text-red-500 hover:text-red-700 underline cursor-pointer transition duration-200">
                        Cancel</p>
                </div>
            </form>

            <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black mt-5">
                <p id="task-count">TASKS(0)</p>
                <p id="complete-count">COMPLETED(0)</p>
            </div>

            <ul class="py-5 flex flex-col gap-3" id="todo-list">
                <!-- <li data-id="1" class="flex gap-2 border border-slate-400 p-4 rounded-xl items-center">
                    <input data-id="1" type="checkbox">
                    <p class="flex-1">Go</p>
                    <div class="flex gap-5">
                        <button data-id="1">Edit</button>
                        <button data-id="1">Delete</button>
                    </div> -->
                </li>
            </ul>

        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
